[package]
name = "canary"
version = "0.50.0"
authors = ["Anders Jensen <anders.c.jensen@gmail.com>"]
edition = "2024"
rust-version = "1.100"
license = "MIT"

[lints.rust]
unused_must_use = "deny"
unsafe_op_in_unsafe_fn = "deny"
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[dependencies]
actix-web = "4"
log = "0.4"
env_logger = "0.11"
