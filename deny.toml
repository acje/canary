[bans]
multiple-versions = "deny"
skip = [
    { name = "windows-sys", version = "0.52.0", reason = "Windows-only target crate pinned by the actix baseline lock; coexists with 0.59.0; never compiled on the darwin/linux targets this repo builds; removed with actix in M03" },
]

